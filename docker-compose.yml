name: party-mixer

services:
  convex:
    image: ghcr.io/convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210"
      - "3211:3211"
    environment:
      CONVEX_CLOUD_ORIGIN: http://${LAN_IP}:3210
      CONVEX_SITE_ORIGIN: http://${LAN_IP}:3211
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      RUST_LOG: info
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CONVEX_URL: http://${LAN_IP}:3210
        NEXT_PUBLIC_CONVEX_SITE_URL: http://${LAN_IP}:3211
        NEXT_PUBLIC_SITE_URL: http://${LAN_IP}:3000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY}
      SITE_URL: http://${LAN_IP}:3000
      NEXT_PUBLIC_CONVEX_URL: http://${LAN_IP}:3210
      NEXT_PUBLIC_CONVEX_SITE_URL: http://${LAN_IP}:3211
      NEXT_PUBLIC_SITE_URL: http://${LAN_IP}:3000
    volumes:
      - party-secrets:/secrets
    depends_on:
      convex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

volumes:
  convex-data:
  party-secrets:
